aid: agora
name: Agora
description: >-
  Agora (agora.finance) is a stablecoin infrastructure company building "money and payments
  for internet markets." Its core product is AUSD, the Agora Dollar — a digital dollar minted
  1:1 with USD and backed 100% by cash, overnight repurchase agreements, and short-term U.S.
  Treasuries. AUSD is an ERC-20 token live across 12+ EVM and Solana networks, with reserves
  managed by VanEck and State Street. Agora also offers white-labeled stablecoins (launch your
  own branded token on an ERC-4626 vault architecture over AUSD), instant liquidity (atomic
  minting against USDC/USDT), and Stable Swaps (a fixed-price, zero-slippage swap protocol for
  verified users). The Agora Public API (Beta, v0) exposes real-time AUSD supply metrics plus
  authenticated Accounts, Routes, and Transactions endpoints for mint/redeem flows. Founded by
  Nick van Eck; backed by General Catalyst, Paradigm, and Dragonfly.
